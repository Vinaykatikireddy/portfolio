events {
    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    
    server {
        listen 7860;

        absolute_redirect off;

        location /fras/api/ {
            proxy_pass http://127.0.0.1:7861/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /fras;

            proxy_redirect off;
        }
        location /fras/ {
            root /var/www;
            try_files $uri $uri/ /fras/index.html;
        }
        location = /fras {
            return 301 /fras/;
        }

        location /resume {
            proxy_ssl_server_name on;
            proxy_ssl_name resume-ashen-phi-99.vercel.app;
            proxy_set_header Host resume-ashen-phi-99.vercel.app;
            proxy_pass https://resume-ashen-phi-99.vercel.app/Vinay_Katikireddy_Resume.pdf;
        }

        location = /resume/ {
            return 301 /resume;
        }

        location /blog/ {
            root /app;
            index index.html;
            try_files $uri $uri/ /blog/index.html;
        }
        location = /blog {
            return 301 /blog/;
        }

        location / {
           root /app/static/;
           index index.html;
           try_files $uri $uri/ /index.html;
        }
    }
}
