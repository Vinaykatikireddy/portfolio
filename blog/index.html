<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Vinay • Blog</title>

<meta name="description" content="A modern markdown-powered personal blog.">
<meta name="theme-color" content="#0f172a">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root{
    --bg:#09090b;
    --surface:#18181b;
    --surface2:#27272a;
    --border:#30363d;
    --text:#f4f4f5;
    --muted:#a1a1aa;
    --accent:#4f8cff;
    --accent2:#8b5cf6;
    --radius:18px;
    --shadow:0 20px 60px rgba(0,0,0,.45);
    --max:1100px;
    --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
    --sans:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

@media(prefers-color-scheme:light){
:root{
    --bg:#f8fafc;
    --surface:#fff;
    --surface2:#f3f4f6;
    --border:#e5e7eb;
    --text:#111827;
    --muted:#6b7280;
    --accent:#2563eb;
    --accent2:#7c3aed;
    --shadow:0 15px 40px rgba(0,0,0,.08);
}
}

*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{
    font-family:var(--sans);
    background:
    radial-gradient(circle at top right,#3b82f615,transparent 35%),
    radial-gradient(circle at bottom left,#8b5cf615,transparent 35%),
    var(--bg);
    color:var(--text);
    line-height:1.8;
}

#progress{
    position:fixed;
    top:0;
    left:0;
    height:3px;
    width:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    z-index:100;
}

.container{
    max-width:var(--max);
    margin:auto;
    padding:30px 20px 70px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:35px;
}

.logo{
    text-decoration:none;
    color:inherit;
}

.logo h1{
    font-size:2rem;
}

.logo p{
    color:var(--muted);
}

nav{
    display:flex;
    gap:16px;
}

nav a{
    text-decoration:none;
    color:var(--muted);
    font-weight:600;
}

nav a:hover{
    color:var(--accent);
}

.hero{
    padding:45px;
    border-radius:var(--radius);
    background:linear-gradient(135deg,var(--surface),var(--surface2));
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    margin-bottom:30px;
}

.hero h2{
    font-size:2.3rem;
    line-height:1.15;
    margin-bottom:12px;
}

.hero p{
    color:var(--muted);
}

#home{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
    gap:22px;
}

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
    transition:.25s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-6px);
    border-color:var(--accent);
}

.card h3{
    margin-bottom:10px;
    line-height:1.3;
}

.card p{
    color:var(--muted);
    margin-bottom:16px;
}

.card small{
    color:var(--accent);
    font-weight:600;
}

#reader{
    display:none;
}

.reader{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:45px;
    box-shadow:var(--shadow);
}

.back{
    display:inline-flex;
    gap:8px;
    align-items:center;
    text-decoration:none;
    color:var(--muted);
    margin-bottom:20px;
    font-weight:600;
}

.back:hover{
    color:var(--accent);
}

.loading{
    color:var(--muted);
}

#error{
    display:none;
    color:#ef4444;
}

article h1,
article h2,
article h3,
article h4{
    margin-top:1.5em;
    margin-bottom:.6em;
    line-height:1.2;
}

article h1{font-size:2.4rem}
article h2{font-size:1.8rem}
article h3{font-size:1.35rem}

article p{
    margin:1.2em 0;
}

article img{
    width:100%;
    border-radius:14px;
    margin:24px 0;
}

article a{
    color:var(--accent);
}

article blockquote{
    border-left:4px solid var(--accent);
    background:rgba(127,127,127,.08);
    padding:10px 20px;
    border-radius:10px;
    color:var(--muted);
    margin:24px 0;
}

article ul,
article ol{
    margin:20px 0 20px 30px;
}

pre{
    background:#0d1117;
    color:#e6edf3;
    padding:20px;
    border-radius:14px;
    overflow:auto;
    margin:24px 0;
}

code{
    font-family:var(--mono);
}

:not(pre)>code{
    background:rgba(127,127,127,.15);
    padding:.2em .45em;
    border-radius:6px;
}

footer{
    text-align:center;
    color:var(--muted);
    margin-top:45px;
}

@media(max-width:700px){

.hero{
padding:30px;
}

.reader{
padding:26px;
}

.hero h2{
font-size:1.8rem;
}

}
</style>
</head>
<body>

<div id="progress"></div>

<div class="container">

<header>

<a class="logo" href="./">
<h1>Vinay</h1>
<p>Thoughts, tutorials & experiments.</p>
</a>

<nav>
<a href="./">Home</a>
</nav>

</header>

<section class="hero">
<h2 id="heroTitle">Welcome to my blog</h2>
<p id="heroSubtitle">Browse articles written in Markdown with a distraction-free reading experience.</p>
</section>

<!-- HOME -->

<section id="home"></section>

<!-- READER -->

<section id="reader">
<div class="reader">

<a class="back" href="./">
← Back to all posts
</a>

<div id="content" class="loading">
Loading article...
</div>

<div id="error">
<h2>404</h2>
<p>Unable to load this article.</p>
</div>

</div>
</section>

<footer>
© <span id="year"></span> Vinay • HTML + CSS + Markdown
</footer>

</div>

<script>

marked.setOptions({
    gfm:true,
    breaks:true
});

/*
---------------------------------------------------------
ADD NEW POSTS HERE
---------------------------------------------------------
Only add the markdown filename (without .md)
---------------------------------------------------------
*/

const POSTS=[
"hello-world",
"getting-started",
"javascript-tips",
"css-tricks",
"markdown-guide"
];

/* -------------------------------------------------- */

const home=document.getElementById("home");
const reader=document.getElementById("reader");
const content=document.getElementById("content");
const error=document.getElementById("error");

async function loadHome(){

home.innerHTML="";

for(const slug of POSTS){

try{

const md=await fetch(slug+".md").then(r=>{
if(!r.ok) throw "";
return r.text();
});

const title=(md.match(/^# (.+)$/m)||[])[1]||slug.replace(/-/g," ");

const body=md
.replace(/^# .+$/m,"")
.replace(/[#>*`_\-\[\]\(\)!]/g,"")
.replace(/\n+/g," ")
.trim()
.substring(0,160);

const card=document.createElement("article");

card.className="card";

card.innerHTML=`
<h3>${title}</h3>
<p>${body}...</p>
<small>Read article →</small>
`;

card.onclick=()=>{

history.pushState({},'',"?post="+slug);
loadPost(slug);

};

home.appendChild(card);

}catch(e){

console.warn(slug+" missing");

}

}

}

async function loadPost(slug){

home.style.display="none";
reader.style.display="block";

content.style.display="block";
content.className="loading";
content.innerHTML="Loading article...";
error.style.display="none";

try{

const md=await fetch(slug+".md").then(r=>{
if(!r.ok) throw "";
return r.text();
});

content.className="";
content.innerHTML=marked.parse(md);

const h1=content.querySelector("h1");

document.title=(h1?h1.textContent:slug)+" • Vinay";
document.getElementById("heroTitle").textContent=h1?h1.textContent:slug;

const first=content.querySelector("p");

document.getElementById("heroSubtitle").textContent=
first?first.textContent.slice(0,160):"";

content.querySelectorAll("img").forEach(img=>{
img.loading="lazy";
img.decoding="async";
});

content.querySelectorAll("a").forEach(a=>{
if(a.hostname && a.hostname!==location.hostname){
a.target="_blank";
a.rel="noopener noreferrer";
}
});

window.scrollTo({
top:0,
behavior:"smooth"
});

}catch{

content.style.display="none";
error.style.display="block";
document.getElementById("heroTitle").textContent="Post not found";
document.getElementById("heroSubtitle").textContent="The requested article doesn't exist.";

}

}

function showHome(){

history.replaceState({},'',location.pathname);

reader.style.display="none";
home.style.display="grid";

document.title="Vinay • Blog";

document.getElementById("heroTitle").textContent=
"Welcome to my blog";

document.getElementById("heroSubtitle").textContent=
"Browse articles written in Markdown with a distraction-free reading experience.";

window.scrollTo({
top:0,
behavior:"smooth"
});

}

document.querySelector(".back").onclick=(e)=>{
e.preventDefault();
showHome();
};

window.onpopstate=()=>{

const slug=new URLSearchParams(location.search).get("post");

if(slug){

loadPost(slug);

}else{

showHome();

}

};

const slug=new URLSearchParams(location.search).get("post");

if(slug){

loadPost(slug);

}else{

loadHome();

}

document.getElementById("year").textContent=new Date().getFullYear();

window.addEventListener("scroll",()=>{

const h=document.documentElement.scrollHeight-document.documentElement.clientHeight;

document.getElementById("progress").style.width=(scrollY/h*100)+"%";

});

</script>

</body>
</html>
