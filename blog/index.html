<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Vinay • Blog</title>
    <meta name="description" content="A modern markdown-powered personal blog.">
    <meta name="theme-color" content="#0f172a">
    
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="progress"></div>

    <div class="container">
        <header>
            <a class="logo" href="./">
                <h1>Vinay</h1>
                <p>Thoughts, tutorials & experiments.</p>
            </a>
            <nav>
                <a href="./">Home</a>
            </nav>
        </header>

        <section class="hero">
            <h2 id="heroTitle">Welcome to my blog</h2>
            <p id="heroSubtitle">Browse articles written in Markdown with a distraction-free reading experience.</p>
        </section>

        <!-- HOME -->
        <section id="home"></section>

        <!-- READER -->
        <section id="reader">
            <div class="reader">
                <a class="back" href="./">
                    ← Back to all posts
                </a>
                <div id="content" class="loading">
                    Loading article...
                </div>
                <div id="error">
                    <h2>404</h2>
                    <p>Unable to load this article.</p>
                </div>
            </div>
        </section>

        <footer>
            © <span id="year"></span> Vinay • HTML + CSS + Markdown
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
