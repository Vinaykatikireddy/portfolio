[supervisord]
 nodaemon=true

[program:nginx]
 command=/usr/sbin/nginx -g 'daemon off;'
 autostart=true
 autorestart=true
 stdout_logfile=/dev/stdout
 stdout_logfile_maxbytes=0
 stderr_logfile=/dev/stderr
 stderr_logfile_maxbytes=0

[program:fras]
 command=python3 -m uvicorn main:app --host 127.0.0.1 --port 7861
 directory=/opt/fras-backend
 environment=PYTHONPATH="/opt/fras-backend"
 autostart=true
 autorestart=true
 startretries=5
 stdout_logfile=/dev/stdout
 stdout_logfile_maxbytes=0
 stderr_logfile=/dev/stderr
 stderr_logfile_maxbytes=0
